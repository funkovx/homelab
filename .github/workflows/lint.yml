name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install yamllint && yamllint .

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate every compose file
        run: |
          for f in stacks/*/compose.yml; do
            dir=$(dirname "$f")
            [ -f "$dir/.env.example" ] && cp "$dir/.env.example" "$dir/.env"
            echo "::group::$f"; docker compose -f "$f" config --quiet; echo "::endgroup::"
          done

  prometheus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: promtool check config and rules
        run: |
          docker run --rm -v "$PWD/stacks/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install ansible-core ansible-lint
      - working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          cp inventory/hosts.example.yml inventory/hosts.yml
          ansible-lint playbooks/ roles/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Jellyfin media server. Runs in the jellyfin LXC (192.168.10.15).
# Config, metadata and the transcode cache live next to this file on the LXC
# rootfs (SSD). Films and series stay on the host data disk (HDD) and are
# bind-mounted into the LXC at /mnt/media (see docs/jellyfin.md), read-only.
name: jellyfin

services:
  jellyfin:
    container_name: jellyfin
    image: docker.io/jellyfin/jellyfin:12.2
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/media:/media:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8096:8096"
    # TMDB's DNS answers resolvers in Russia with 127.0.0.1, which leaves the
    # library without metadata and artwork. tmdb-hosts.sh writes the addresses
    # a US client gets into .env; until it has run, nothing changes.
    extra_hosts:
      - "api.themoviedb.org:${TMDB_API_IP:-127.0.0.1}"
      - "image.tmdb.org:${TMDB_IMAGE_IP:-127.0.0.1}"
      - "www.themoviedb.org:${TMDB_WWW_IP:-127.0.0.1}"
    restart: unless-stopped

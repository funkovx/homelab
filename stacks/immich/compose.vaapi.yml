# Optional: hardware video transcoding on the Ryzen iGPU (VA-API).
# Needs /dev/dri passed into the LXC, see docs/immich-vm-to-lxc.md.
#   docker compose -f compose.yml -f compose.vaapi.yml up -d
# Then pick "VAAPI" under Administration -> Video transcoding -> Hardware acceleration.
services:
  immich-server:
    devices:
      - /dev/dri:/dev/dri

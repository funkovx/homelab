# Start page for the LAN.
# No weather widget: its only source, open-meteo (Hetzner), is not reachable from the home ISP.
pages:
  - name: Infrastructure
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

      - size: full
        widgets:
          - type: monitor
            title: Services
            cache: 1m
            sites:
              - title: Proxmox VE
                url: https://192.168.10.2:8006
                icon: si:proxmox
                allow-insecure: true # self-signed certificate
              - title: Immich
                url: http://192.168.10.13:2283
                icon: si:immich
              - title: Navidrome
                url: http://192.168.10.7:4533
                icon: si:musicbrainz
              - title: Jellyfin
                url: http://192.168.10.15:8096
                icon: si:jellyfin
              - title: File Browser
                url: http://192.168.10.6:8080
                icon: mdi:folder
              - title: Pi-hole
                url: https://192.168.10.11/admin/
                icon: si:pi-hole
                allow-insecure: true
              - title: Grafana
                url: http://192.168.10.14:3000
                icon: si:grafana
              - title: Beszel
                url: http://192.168.10.14:8090
                icon: si:speedtest

      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday
          - type: releases
            repositories:
              - immich-app/immich
              - navidrome/navidrome
              - jellyfin/jellyfin
              - tailscale/tailscale
              - glanceapp/glance

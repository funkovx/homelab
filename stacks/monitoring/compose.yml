# Monitoring for the whole lab. Runs in its own LXC (monitoring, 192.168.10.14).
#
#   Prometheus        :9090  metrics and alert rules
#   Grafana           :3000  dashboards for metrics, probes and logs
#   Loki              :3100  log storage; Grafana Alloy on the guests pushes here
#   Tempo             :3200  trace storage; apps send OTLP to :4317 (gRPC) / :4318 (HTTP)
#   pve-exporter             Proxmox API -> status and usage of every LXC and VM
#   blackbox-exporter        HTTP checks of every service, TLS expiry of public domains
#
# node-exporter and Alloy run on the guests themselves (see ansible/).
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver # Tempo writes span metrics here
      - --enable-feature=exemplar-storage # links from graphs to traces
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 512m

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Grafana traces itself into Tempo, so there is data from day one
      GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS: tempo:4317
      GF_TRACING_OPENTELEMETRY_OTLP_PROPAGATION: w3c
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    mem_limit: 384m

  # Tempo runs as UID 10001; this one-shot container fixes volume ownership
  # (the Tempo image has no shell or coreutils, so busybox does the chown)
  tempo-init:
    image: busybox:1.37
    user: root
    command: [chown, "-R", "10001:10001", /var/tempo]
    volumes:
      - tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    command: -config.file=/etc/tempo/config.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    mem_limit: 384m

  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.10.1
    restart: unless-stopped
    environment:
      PVE_USER: ${PVE_USER:-prometheus@pve}
      PVE_TOKEN_NAME: ${PVE_TOKEN_NAME:-monitoring}
      PVE_TOKEN_VALUE: ${PVE_TOKEN_VALUE:?set PVE_TOKEN_VALUE in .env}
      PVE_VERIFY_SSL: "false" # self-signed certificate on the LAN
    mem_limit: 128m

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 64m

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
